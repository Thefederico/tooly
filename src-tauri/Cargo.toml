[package]
name = "tooly"
version = "0.1.0"
description = "Tooly — PS5 Homebrew App & Payload Updater"
authors = ["Tooly Contributors"]
edition = "2021"
default-run = "tooly"


[lib]
name = "tooly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.10"
suppaftp = { version = "6.0", default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[[bin]]
name = "tooly"
path = "src/main.rs"

[[bin]]
name = "tooly-daemon"
path = "src/bin/daemon.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
